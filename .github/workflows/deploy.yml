name: Deploy to server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            APP_DIR="/opt/dorvey"
            REPO_URL="git@github.com:${{ github.repository }}.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "First deployment: creating $APP_DIR and cloning..."
              sudo mkdir -p "$APP_DIR"
              sudo chown $(whoami):$(whoami) "$APP_DIR"
              ssh-keyscan -t rsa,ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null || true
              git clone --branch main "$REPO_URL" "$APP_DIR"
              cd "$APP_DIR"
            else
              echo "Updating existing repository..."
              cd "$APP_DIR"
              git fetch origin main
              git reset --hard origin/main
            fi

            # Останавливаем контейнеры БЕЗ удаления томов. Никогда не использовать: docker compose down -v
            # (флаг -v удалит volume postgres_data и все данные БД будут потеряны)
            echo "Stopping containers (volumes preserved - never use down -v)..."
            docker compose -f docker-compose.prod.yml down

            echo "Building and starting..."
            docker compose -f docker-compose.prod.yml up -d --build || {
              echo "=== Deploy failed, showing backend logs ==="
              docker compose -f docker-compose.prod.yml logs backend
              exit 1
            }

            # Backend при старте выполняет: alembic upgrade head && uvicorn ...
            # Миграции только добавляют новые таблицы/колонки, существующие данные не трогают.
            echo "Waiting for Postgres and backend (migrations run on backend start)..."
            sleep 15

            echo "Container status:"
            docker compose -f docker-compose.prod.yml ps

            echo "Warmup..."
            curl -sS "http://localhost:8085/api/health" > /dev/null || true

            echo "Deploy done. DB data is in volume postgres_data (persists across deploys)."
