# Nginx config for cloaking (bot vs human)
# Add this inside your server {} block for the doorway domain.
# Bots (Googlebot, YandexBot, etc.) receive index.seo.html; humans receive index.html.

map $http_user_agent $cloak_suffix {
    default "";
    ~*(?i)Googlebot ".seo";
    ~*(?i)YandexBot ".seo";
    ~*(?i)Yandex ".seo";
    ~*(?i)bingbot ".seo";
    ~*(?i)BingPreview ".seo";
    ~*(?i)Slurp ".seo";
    ~*(?i)DuckDuckBot ".seo";
    ~*(?i)Baiduspider ".seo";
    ~*(?i)facebookexternalhit ".seo";
    ~*(?i)Twitterbot ".seo";
    ~*(?i)LinkedInBot ".seo";
    ~*(?i)TelegramBot ".seo";
    ~*(?i)Applebot ".seo";
}

server {
    listen 80;
    server_name your-domain.com;
    root /var/www/html;

    location / {
        try_files $uri $uri/ $uri/index$cloak_suffix.html $uri/index.html =404;
    }

    # For root path (index at /):
    location = / {
        try_files /index$cloak_suffix.html /index.html =404;
    }
}
