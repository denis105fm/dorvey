# Production: порты с запасом (8085, 8445, 5435, 6382)
# На сервере заняты: 80, 81, 443, 5533, 5678, 8080, 8081
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dorvey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dorvey}
      POSTGRES_DB: ${POSTGRES_DB:-dorvey}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dorvey} -d ${POSTGRES_DB:-dorvey}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dorvey}:${POSTGRES_PASSWORD:-dorvey}@postgres:5432/${POSTGRES_DB:-dorvey}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CORS_ORIGINS: '["http://localhost:8085","http://127.0.0.1:8085","https://localhost:8445","https://127.0.0.1:8445","${APP_URL:-http://localhost:8085}"]'
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      FETCHSERP_API_BASE: ${FETCHSERP_API_BASE:-https://www.fetchserp.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "8085:80"
      - "8445:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app worker -l info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dorvey}:${POSTGRES_PASSWORD:-dorvey}@postgres:5432/${POSTGRES_DB:-dorvey}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A app.celery_app beat -l info
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dorvey}:${POSTGRES_PASSWORD:-dorvey}@postgres:5432/${POSTGRES_DB:-dorvey}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
    depends_on:
      - celery
      - redis

volumes:
  postgres_data:
