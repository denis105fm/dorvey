# Production: порты с запасом (8080, 8443, 5434, 6381)
# Чтобы не конфликтовать с 80/443, 5432, 6379 и др.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dorvey}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dorvey}
      POSTGRES_DB: ${POSTGRES_DB:-dorvey}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dorvey} -d ${POSTGRES_DB:-dorvey}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-dorvey}:${POSTGRES_PASSWORD:-dorvey}@postgres:5432/${POSTGRES_DB:-dorvey}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CORS_ORIGINS: '["http://localhost:8080","http://127.0.0.1:8080","https://localhost:8443","https://127.0.0.1:8443","${APP_URL}"]'
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEBUG: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
